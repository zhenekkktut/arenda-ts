name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "offline/**"
      - "tests/**"
      - "app/rental-app.tsx"
      - "app/document-tools.ts"
      - "app/tax-calculation.ts"
      - "app/expense-shortcuts.ts"
      - "app/globals.css"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.mjs"
      - "vendor/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "offline/**"
      - "tests/**"
      - "app/rental-app.tsx"
      - "app/document-tools.ts"
      - "app/tax-calculation.ts"
      - "app/expense-shortcuts.ts"
      - "app/globals.css"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-latest
  cancel-in-progress: true

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Собрать автономный интерфейс
        run: |
          npm ci
          node --test --test-concurrency=1 tests/document-tools.test.mjs tests/invoice-periods.test.mjs tests/offline-archive.test.mjs tests/offline-documents.test.mjs tests/offline-undo.test.mjs tests/mobile-layout.test.mjs tests/tax-calculation.test.mjs tests/expense-shortcuts.test.mjs tests/offline-shortcuts.test.mjs
          ./node_modules/.bin/vite build --config offline/vite.config.ts

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Собрать устанавливаемый APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Подготовить файл
        run: cp android/app/build/outputs/apk/debug/app-debug.apk arenda-ts.apk

      - name: Подготовить формы для проверки PDF
        run: node tests/pdf-fixture.mjs android/app/src/androidTest/assets

      - name: Разрешить ускорение эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверить сохранение обоих PDF на Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash tests/run-android-pdf-tests.sh

      - name: Сохранить отчёт проверки PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pdf-test-report
          path: |
            android/app/build/reports/androidTests/connected/
            android-pdf-test-output/

      - name: Сохранить результат сборки
        uses: actions/upload-artifact@v4
        with:
          name: arenda-ts-apk
          path: arenda-ts.apk
          retention-days: 30

      - name: Обновить прямую ссылку на APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest arenda-ts.apk --clobber
            gh release edit android-latest --title "Аренда ТС — Android" --notes "Автономная версия 2.0. Работает без ChatGPT, сайта, VPN и интернета. Данные хранятся на телефоне; предусмотрены Excel и резервная копия."
          else
            gh release create android-latest arenda-ts.apk --target "$GITHUB_SHA" --title "Аренда ТС — Android" --notes "Автономная версия 2.0. Работает без ChatGPT, сайта, VPN и интернета. Данные хранятся на телефоне; предусмотрены Excel и резервная копия."
          fi
