name: Android APK

on:
  push:
    branches: [documents-v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-documents-v3
  cancel-in-progress: true

jobs:
  build:
    name: Собрать APK 3.0
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Проверить расчёты документов
        run: |
          npm ci
          node --test tests/document-tools.test.mjs
      - name: Собрать автономный интерфейс
        run: ./node_modules/.bin/vite build --config offline/vite.config.ts
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Собрать APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Подготовить APK и инструменты подписи
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk arenda-ts.apk
          mkdir -p signer/lib
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          zipalign_path="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          cp "$apksigner_path" signer/apksigner
          cp "$(dirname "$apksigner_path")/lib/apksigner.jar" signer/lib/apksigner.jar
          cp "$zipalign_path" signer/zipalign
      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: arenda-ts-v3-build
          path: |
            arenda-ts.apk
            signer
          retention-days: 30
