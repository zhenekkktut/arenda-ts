name: Проверка Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "offline/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: android-main-check
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'issues' || (github.actor == github.repository_owner && startsWith(github.event.issue.title, '[build-apk]'))
    name: Проверить автономное приложение
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Проверить расчёты документов
        run: |
          npm ci
          node --test tests/document-tools.test.mjs
      - name: Собрать автономный интерфейс
        run: ./node_modules/.bin/vite build --config offline/vite.config.ts
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Проверить Android-сборку
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Подготовить установочный файл
        run: cp android/app/build/outputs/apk/debug/app-debug.apk arenda-ts.apk
      - name: Сохранить установочный файл
        uses: actions/upload-artifact@v4
        with:
          name: arenda-ts-apk
          path: arenda-ts.apk
          retention-days: 30
